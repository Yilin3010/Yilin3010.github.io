<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Home Practical (Sign-up form)</title>
<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
/>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script
src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body><div style="background:#28352c;color:#fff;padding:12px 20px;font:14px Arial;text-align:center;position:relative;z-index:9999">Archived coursework · Forms are demonstrations only. <a style="color:#fff;text-decoration:underline" href="../../index.html#work">Return to portfolio</a></div>
    <div class="container">
        <div class="row">
            <div class="col-md-6 mx-auto my-5">
                <!--form will start from here-->
                <h2>Sign Up</h2>
                <form>
                   <!-- Name -->
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" placeholder="Enter your full name" required />
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="Enter your email" required />
          </div>

          <!-- Password -->
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Enter your password" required />
          </div>

          <!-- Confirm Password -->
          <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your password" required />
          </div>

          <!-- Country Dropdown -->
          <div class="mb-3">
            <label for="country" class="form-label">Country</label>
            <select class="form-select" id="country" required>
              <option value="" disabled selected>Choose your country</option>
              <option value="sg">Singapore</option>
              <option value="my">Malaysia</option>
              <option value="id">Indonesia</option>
              <option value="th">Thailand</option>
              <option value="others">Others</option>
            </select>
          </div>

          <!-- Gender Radio Buttons -->
          <div class="mb-3">
            <label class="form-label d-block">Gender</label>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="gender" id="male" value="male" required />
              <label class="form-check-label" for="male">Male</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="gender" id="female" value="female" />
              <label class="form-check-label" for="female">Female</label>
            </div>
          </div>

          <!-- Terms and Conditions Checkbox -->
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="terms" required />
            <label class="form-check-label" for="terms">I agree to the terms and conditions</label>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary">Sign Up</button>
        </form>
            </div>
        </div>
    </div>
<script>document.addEventListener("submit",function(e){e.preventDefault();e.stopImmediatePropagation();alert("Coursework demonstration only. No information is submitted.");},true);</script></body>
</html>
